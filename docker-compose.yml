services:
  dev:
    build:
      context: .
      target: dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_PROXY_TARGET=http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"

  app:
    build:
      context: .
      target: prod
    ports:
      - "4173:80"
